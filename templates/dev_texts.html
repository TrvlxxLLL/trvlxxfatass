<section class="dev__panel glass-card" data-panel="texts">
    <h2>Тексты уведомлений пользователя</h2>
    <p class="dev__hint">Эти строки видит житель во время отправки сообщения о происшествии.</p>

    <label class="field">Идёт загрузка фото
        <input type="text" data-setting="notify_uploading">
    </label>

    <label class="field">Фото загружено
        <input type="text" data-setting="notify_photo_ready">
    </label>

    <label class="field">Подсказка на шаге выбора места происшествия
        <input type="text" data-setting="notify_point_hint">
    </label>

    <label class="field">Подсказка на шаге описания происшествия
        <input type="text" data-setting="notify_comment_hint">
    </label>

    <label class="field">Успешная отправка
        <input type="text" data-setting="notify_success">
    </label>

    <label class="field">Благодарность
        <input type="text" data-setting="notify_thanks">
    </label>

    <label class="field">Сообщение ушло на проверку
        <input type="text" data-setting="notify_pending">
    </label>

    <label class="field">Ошибка отправки
        <input type="text" data-setting="notify_error">
    </label>

    <div class="dev__actions">
        <button type="button" class="submit-btn" data-save>Сохранить</button>
    </div>
</section>
